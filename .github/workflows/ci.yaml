name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        env:
          PYTHONPATH: src
        run: uv run --no-project python -m unittest discover -s tests -t . -v

      - name: Check the package builds and both console scripts run
        run: |
          uv run --refresh-package niccolomineo-pre-commit-hooks --with . --no-project \
            check-env-example --version
          uv run --refresh-package niccolomineo-pre-commit-hooks --with . --no-project \
            check-version-consistency --version

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - name: Run every hook against every file
        run: uvx prek run --all-files --show-diff-on-failure --color=always
